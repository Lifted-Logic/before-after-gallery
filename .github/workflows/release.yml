name: Release

# Merging a new version to main publishes it: the zip and info.json go to
# DigitalOcean Spaces, where sites check for updates (src/Support/Updater.php),
# plus a stable before-after-gallery-latest.zip for new installs.
#
# Repository variables: SPACES_BUCKET, SPACES_REGION (e.g. nyc3),
#   SPACES_PUBLIC_URL (public base URL of the bucket, no trailing slash)
# Repository secrets: SPACES_KEY, SPACES_SECRET
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          HEADER=$(grep -oP "^\s*\*\s*Version:\s*\K[0-9.]+" ll-bag.php)
          VERSION=$(grep -oP "define\('LL_BAG_VERSION',\s*'\K[0-9.]+" ll-bag.php)
          PKG=$(node -p "require('./package.json').version")

          if [ "$HEADER" != "$VERSION" ] || [ "$VERSION" != "$PKG" ]; then
            echo "::error::Version drift — header ${HEADER}, LL_BAG_VERSION ${VERSION}, package.json ${PKG}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already released — nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is new — building release."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      SLUG: before-after-gallery
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - run: npm ci

      - name: Build and verify release zip
        run: npm run dist

      - name: Write info.json
        env:
          PUBLIC_URL: ${{ vars.SPACES_PUBLIC_URL }}
        run: |
          header() { grep -m1 -E "^[[:space:]]*\*[[:space:]]*$1:" ll-bag.php | sed -E "s/^[[:space:]]*\*[[:space:]]*$1:[[:space:]]*//"; }

          # Changelog: commit subjects since the previous release tag.
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          CHANGES=$(git log --no-merges --format='%s' ${PREV:+$PREV..}HEAD \
            | jq -Rr '@html "<li>\(.)</li>"' | tr -d '\n')

          jq -n \
            --arg name "$(header 'Plugin Name')" \
            --arg version "$VERSION" \
            --arg download_url "$PUBLIC_URL/$SLUG/$SLUG-$VERSION.zip" \
            --arg requires "$(header 'Requires at least')" \
            --arg requires_php "$(header 'Requires PHP')" \
            --arg author "$(header 'Author')" \
            --arg last_updated "$(date -u '+%Y-%m-%d %H:%M:%S')" \
            --arg changelog "<h4>$VERSION</h4><ul>$CHANGES</ul>" \
            '{name: $name, slug: env.SLUG, version: $version, download_url: $download_url,
              requires: $requires, requires_php: $requires_php, author: $author,
              last_updated: $last_updated, sections: {changelog: $changelog}}' \
            > dist/info.json

          cat dist/info.json

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET }}
          AWS_DEFAULT_REGION: us-east-1 # required by the CLI; Spaces uses the endpoint below
          BUCKET: ${{ vars.SPACES_BUCKET }}
          ENDPOINT: https://${{ vars.SPACES_REGION }}.digitaloceanspaces.com
        run: |
          ZIP="dist/$SLUG-$VERSION.zip"
          # Zip first, so info.json never points at a file that isn't there yet.
          aws s3 cp "$ZIP" "s3://$BUCKET/$SLUG/" \
            --endpoint-url "$ENDPOINT" --acl public-read --content-type application/zip
          # Stable URL for new installs (wp plugin install). Overwritten each release, so never cached.
          aws s3 cp "$ZIP" "s3://$BUCKET/$SLUG/$SLUG-latest.zip" \
            --endpoint-url "$ENDPOINT" --acl public-read --content-type application/zip \
            --cache-control "no-cache, max-age=0"
          aws s3 cp dist/info.json "s3://$BUCKET/$SLUG/info.json" \
            --endpoint-url "$ENDPOINT" --acl public-read --content-type application/json \
            --cache-control "no-cache, max-age=0"

      - name: Check the published files are reachable
        env:
          PUBLIC_URL: ${{ vars.SPACES_PUBLIC_URL }}
        run: |
          curl -fsSI "$PUBLIC_URL/$SLUG/$SLUG-$VERSION.zip" > /dev/null
          # The latest zip must be byte-identical to this release's zip.
          curl -fsS "$PUBLIC_URL/$SLUG/$SLUG-latest.zip" | cmp - "dist/$SLUG-$VERSION.zip"
          curl -fsS "$PUBLIC_URL/$SLUG/info.json" | jq -e --arg v "$VERSION" '.version == $v'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          files: dist/${{ env.SLUG }}-${{ env.VERSION }}.zip
          generate_release_notes: true
