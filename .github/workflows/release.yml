name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          VERSION=$(grep -oP "define\('LL_BAG_VERSION',\s*'\K[0-9.]+" ll-bag.php)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already released — nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is new — building release."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - run: npm ci

      - name: Build and verify release zip
        run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          files: dist/before-after-gallery-*.zip
          generate_release_notes: true
