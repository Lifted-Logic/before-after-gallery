name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Verify tag matches LL_BAG_VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP "define\('LL_BAG_VERSION',\s*'\K[0-9.]+" ll-bag.php)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match LL_BAG_VERSION ${VERSION}"
            exit 1
          fi
          echo "Releasing ${VERSION}"

      - run: npm ci

      - name: Build and verify release zip
        run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/before-after-gallery-*.zip
          generate_release_notes: true
